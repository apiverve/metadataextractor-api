openapi: 3.0.4
info:
  title: Metadata Extractor
  description: >-
    Metadata Extractor is a website metadata extraction API that pulls HTML meta
    tags from any submitted URL, returning the page title, meta description,
    author, robots directives, and language. Paid tiers add Open Graph tags,
    JSON-LD schemas, and favicons.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
